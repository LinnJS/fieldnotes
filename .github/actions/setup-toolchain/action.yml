name: Set up toolchain
description: Install uv, the locked Python environment, the pinned Pandoc release, and a CJK font.

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        enable-cache: true

    - name: Install the locked Python environment
      shell: bash
      run: uv sync --locked

    # Pandoc is a system tool and not a wheel, so the release package is pinned by
    # version and digest here. Keep the version at or above MINIMUM_PANDOC_VERSION
    # in scripts/kb/export.py.
    - name: Install Pandoc
      shell: bash
      env:
        PANDOC_VERSION: "3.14"
        PANDOC_SHA256: dedb81f20345b76d7168ba551d90abceb707977fece789a79874094fe3833915
      run: |
        set -euo pipefail
        package="pandoc-${PANDOC_VERSION}-1-amd64.deb"
        curl --fail --silent --show-error --location \
          --output "${RUNNER_TEMP}/${package}" \
          "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/${package}"
        echo "${PANDOC_SHA256}  ${RUNNER_TEMP}/${package}" | sha256sum --check
        sudo dpkg --install "${RUNNER_TEMP}/${package}"
        pandoc --version | head -n 1

    # The PDF export needs a CJK face to print an author's native-script name.
    - name: Install a CJK font
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends fonts-noto-cjk
